version: 2

models:
  - name: bronze_customers
    description: "Raw customer extract (no casting/trim/rename); adds record_source + _loaded_at metadata."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
