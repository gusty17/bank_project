version: 2

sources:
  - name: bank
    description: "Raw synthetic banking data loaded into the Postgres public schema."
    schema: public
    tables:
      - name: customers
        description: "Raw customer records."
        columns:
          - name: customer_id
            description: "Business key for a customer."
            data_tests: [unique, not_null]
      - name: accounts
        description: "Raw bank account records."
        columns:
          - name: account_id
            description: "Business key for an account."
            data_tests: [unique, not_null]
          - name: customer_id
            description: "FK to customers."
      - name: cards
        description: "Raw card records."
        columns:
          - name: card_id
            description: "Business key for a card."
            data_tests: [unique, not_null]
          - name: account_id
            description: "FK to accounts."
      - name: branches
        description: "Raw branch records."
        columns:
          - name: branch_id
            description: "Business key for a branch."
            data_tests: [unique, not_null]
      - name: loans
        description: "Raw loan records."
        columns:
          - name: loan_id
            description: "Business key for a loan."
            data_tests: [unique, not_null]
          - name: customer_id
            description: "FK to customers."
      - name: merchants
        description: "Raw merchant records."
        columns:
          - name: merchant_id
            description: "Business key for a merchant."
            data_tests: [unique, not_null]
      - name: transactions
        description: "Raw transaction events linking accounts to merchants."
        columns:
          - name: transaction_id
            description: "Business key for a transaction."
            data_tests: [unique, not_null]
          - name: account_id
            description: "FK to accounts."
          - name: merchant_id
            description: "FK to merchants."

models:
  - name: bronze_customers
    description: "Cleaned/typed customer records. Renaming and type-casting only."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_accounts
    description: "Cleaned/typed account records. balance_usd cast to numeric(15,2)."
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_cards
    description: "Cleaned/typed card records."
    columns:
      - name: card_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_branches
    description: "Cleaned/typed branch records."
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_loans
    description: "Cleaned/typed loan records. Amount/rate cast to explicit precision."
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_merchants
    description: "Cleaned/typed merchant records."
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
  - name: bronze_transactions
    description: "Cleaned/typed transaction events. amount_usd cast to numeric(15,2); transaction_date is a timestamp."
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: record_source
        description: "Data origin tag. Value 'kaggle_csv'; inherited by the silver layer."
        data_tests: [not_null]
