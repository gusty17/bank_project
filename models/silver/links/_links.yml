version: 2

models:
  - name: link_customer_account
    description: "Data Vault link relating customers to accounts."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_hub_key
              - account_hub_key
    columns:
      - name: customer_account_link_key
        description: "Hashed key (md5 of customer_id + account_id)."
        data_tests: [unique, not_null]
      - name: customer_hub_key
        description: "FK to hub_customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hub_key
      - name: account_hub_key
        description: "FK to hub_account."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_account')
                field: account_hub_key
      - name: load_date
        description: "Ingestion timestamp inherited from bronze."
        data_tests: [not_null]

  - name: link_account_card
    description: "Data Vault link relating accounts to cards."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
