version: 2

models:
  - name: hub_customer
    description: "Data Vault hub for customers. One row per unique customer business key."
    columns:
      - name: customer_hub_key
        description: "Hashed business key (md5 of customer_id)."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Customer business key."
        data_tests: [unique, not_null]
      - name: load_date
        description: "Ingestion timestamp inherited from bronze."
        data_tests: [not_null]

  - name: hub_account
