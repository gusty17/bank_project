version: 2

models:
  - name: sat_customer_details
    description: "Full-history satellite of descriptive customer attributes. One row per (customer_hub_key, load_date) version; new version inserted only when the hashdiff changes."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_hub_key
              - load_date
    columns:
      - name: customer_hub_key
        description: "FK to hub_customer (repeats across historical versions)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hub_key
      - name: hashdiff
        description: "Hash of all descriptive attributes, used to detect changes."
        data_tests: [not_null]

  - name: sat_account_details
